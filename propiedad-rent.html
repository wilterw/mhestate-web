<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Alquiler | MH Estate</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/detail.css"> 
    <link rel="stylesheet" href="assets/css/contact.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Gilda+Display&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS WIDGET RESERVA (Mantenidos) --- */
        .booking-widget-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: sticky;
            top: 100px;
            z-index: 10;
        }
        .booking-header { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; display: flex; align-items: baseline; gap: 10px; }
        .booking-price { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 700; color: #C5A059; }
        .booking-unit { font-size: 16px; color: #666; font-weight: 400; }
        .booking-dates-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .date-field label { display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; color: #000; letter-spacing: 1px; }
        .date-input-styled { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: 'Inter', sans-serif; font-size: 14px; color: #333; background: #f9f9f9; border-radius: 0; }
        .booking-summary-box { background-color: #f4f4f4; padding: 20px; margin-bottom: 20px; display: none; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #555; }
        .summary-total-row { border-top: 1px solid #ddd; padding-top: 15px; margin-top: 10px; display: flex; justify-content: space-between; font-family: 'Gilda Display', serif; font-size: 20px; color: #000; }
        .btn-book-action { width: 100%; background-color: #000; color: #fff; padding: 18px; text-transform: uppercase; font-weight: 600; font-size: 13px; letter-spacing: 2px; border: none; cursor: pointer; transition: background 0.3s ease; }
        .btn-book-action:hover { background-color: #C5A059; }
        .booking-agent-mini { margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 15px; }
        .booking-agent-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }

        /* --- NUEVOS ESTILOS GALERÍA BENTO GRID --- */
        .rent-gallery-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* 1. Imagen Principal (16:9) */
        .rent-hero-main {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 4px; /* Opcional: bordes suaves */
            cursor: pointer;
            position: relative;
        }
        .rent-hero-main img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .rent-hero-main:hover img { transform: scale(1.02); }

        /* 2. Fila Inferior (Dividida 50/50) */
        .rent-gallery-bottom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            height: 400px; /* Altura fija para mantener proporción */
        }

        /* Izquierda: Cuadrada Grande */
        .gallery-big-square {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
        }
        .gallery-big-square img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-big-square:hover img { transform: scale(1.02); }

        /* Derecha: Grid 2x2 (4 pequeñas) */
        .gallery-quad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            height: 100%;
        }

        .gallery-small-item {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .gallery-small-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-small-item:hover img { transform: scale(1.03); }

        /* Overlay "+X Fotos" */
        .more-photos-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .gallery-small-item:hover .more-photos-overlay {
            opacity: 1;
            background: rgba(0, 0, 0, 0.7);
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .booking-widget-card { position: static; margin-top: 40px; }
            
            /* En móvil simplificamos a un slider horizontal o pila */
            .rent-gallery-bottom { display: none; } /* Ocultamos la rejilla compleja */
            .rent-hero-main { aspect-ratio: 4/3; } /* Más cuadrado en móvil */
            
            /* Podríamos añadir un indicador de "Ver galería" en la foto principal */
            .rent-hero-main::after {
                content: '📷 Ver Galería';
                position: absolute; bottom: 10px; right: 10px;
                background: rgba(0,0,0,0.7); color: #fff;
                padding: 5px 10px; border-radius: 4px; font-size: 12px;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        
        <section class="property-hero-bg" style="padding-bottom: 20px;">
            <div class="hero-wrapper">
                <div class="back-btn-container">
                    <a href="rent.html" class="btn-back-pill">← <span data-i18n="btn-back">Volver</span></a>
                </div>
                <div class="hero-header">
                    <span class="prop-tag" id="prop-tag" style="background-color: #000; color: #fff;">ALQUILER</span>
                    <h1 class="prop-title" id="prop-title">Cargando...</h1>
                    <div class="hero-meta">
                        <p class="prop-location" id="prop-location"></p>
                        <span id="prop-ref" class="prop-ref"></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="gallery-section" style="padding-top: 0;">
            <div class="container-narrow">
                <div id="gallery-container">
                    </div>
            </div>
        </section>

        <section class="sticky-nav-section">
            <div class="container-narrow">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="tab-desc" data-i18n="tab-desc">Descripción</button>
                    <button class="tab-btn" data-tab="tab-facts" data-i18n="tab-facts">Datos</button>
                    <button class="tab-btn" data-tab="tab-map" data-i18n="tab-map">Mapa</button>
                    <button class="tab-btn" data-tab="tab-plan" data-i18n="tab-plan">Plano</button>
                </div>
            </div>
        </section>

        <section class="content-split-section">
            <div class="container-narrow">
                <div class="tab-content-wrapper">
                    
                    <div id="tab-desc" class="tab-pane active">
                        <div class="desc-layout-grid">
                            
                            <div class="desc-content-col">
                                <h3 class="tab-inner-title" data-i18n="title-desc">Sobre esta propiedad</h3>
                                <div id="prop-description" class="formatted-text"></div>
                            </div>
                            
                            <aside class="agent-sidebar-col">
                                <div class="booking-widget-card">
                                    <div class="booking-header">
                                        <span id="rent-price-display" class="booking-price">--- €</span>
                                        <span id="rent-unit-display" class="booking-unit">/ noche</span>
                                    </div>
                                    <div class="booking-dates-grid">
                                        <div class="date-field">
                                            <label id="lbl-checkin">Llegada</label>
                                            <input type="date" id="date-checkin" class="date-input-styled">
                                        </div>
                                        <div class="date-field">
                                            <label id="lbl-checkout">Salida</label>
                                            <input type="date" id="date-checkout" class="date-input-styled">
                                        </div>
                                    </div>
                                    <div id="booking-summary" class="booking-summary-box">
                                        <div class="summary-row">
                                            <span id="txt-nights-count">0 noches</span>
                                            <span id="txt-calc-subtotal">0 €</span>
                                        </div>
                                        <div class="summary-total-row">
                                            <span data-i18n="total">TOTAL</span>
                                            <span id="txt-total">0 €</span>
                                        </div>
                                    </div>
                                    <button id="btn-request-book" class="btn-book-action">SOLICITAR RESERVA</button>
                                    <div class="booking-agent-mini">
                                        <img src="assets/img/logo mh state negro.png" id="mini-agent-img" class="booking-agent-img" alt="Agent">
                                        <div class="booking-agent-text">
                                            <p data-i18n="managed_by">Gestionado por</p>
                                            <h4 id="mini-agent-name">MH Estate</h4>
                                        </div>
                                    </div>
                                </div>
                            </aside>

                        </div>
                    </div>

                    <div id="tab-facts" class="tab-pane">
                        <div id="tab-facts-content" class="technical-grid"></div>
                    </div>
                    <div id="tab-map" class="tab-pane">
                        <div id="map-container" style="width: 100%; height: 450px; background: #eee; border-radius: 8px;"></div>
                    </div>
                    <div id="tab-plan" class="tab-pane">
                        <div id="plan-container" class="media-placeholder"><p data-i18n="no-data">Plano no disponible</p></div>
                    </div>

                </div>
            </div>
        </section>

        <section class="similar-section">
            <div class="container-narrow">
                <h2 class="section-title" data-i18n="similar-title">Propiedades Similares</h2>
                <div class="carousel-wrapper">
                    <button class="carousel-nav-btn prev-btn" id="sim-prev">&#10094;</button>
                    <div id="similar-container"></div>
                    <button class="carousel-nav-btn next-btn" id="sim-next">&#10095;</button>
                </div>
            </div>
        </section>

    </main>

    <div id="lightbox-modal" class="lightbox">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <div class="lightbox-content">
            <button class="lb-nav prev" onclick="changeLightboxSlide(-1)">&#10094;</button>
            <div id="lightbox-media-container"></div>
            <button class="lb-nav next" onclick="changeLightboxSlide(1)">&#10095;</button>
        </div>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/rent-detail.js"></script> 

</body>
</html>
